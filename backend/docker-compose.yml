# Pinned so the project (and container) name does not depend on the folder
# the repo is cloned into.
name: ai-workflow

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Public demo: unlocked workflows are removed after this many hours.
      # Set 0 in .env to keep everything.
      DEMO_WORKFLOW_TTL_HOURS: ${DEMO_WORKFLOW_TTL_HOURS:-72}
      PORT: "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ai-workflow-net

networks:
  ai-workflow-net:
    driver: bridge
